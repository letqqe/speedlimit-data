name: build-roadlimits
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      offset:
        description: "Skip this many unpublished regions (0 for the first run)"
        default: "0"
        required: true
      count:
        description: "How many regions to build in this run (max 256)"
        default: "256"
        required: true
permissions:
  contents: write

concurrency:
  group: build-roadlimits
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFSET: ${{ inputs.offset || '0' }}
          COUNT: ${{ inputs.count || '256' }}
        run: |
          # Every road-limit release, and the names already published on them.
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^roadlimits-' > tags.txt || true
          : > published.txt
          while read -r tag; do
            gh release view "$tag" --json assets --jq '.assets[].name' >> published.txt
          done < tags.txt
          # Build into the newest release that has room (GitHub allows 1000 assets per release).
          TAG=""
          while read -r tag; do
            n=$(gh release view "$tag" --json assets --jq '.assets | length')
            if [ "$n" -lt 900 ]; then TAG="$tag"; fi
          done < tags.txt
          if [ -z "$TAG" ]; then
            LAST=$(sort -V tags.txt | tail -1 | sed 's/^roadlimits-v//')
            TAG="roadlimits-v$(( ${LAST:-0} + 1 ))"
            gh release create "$TAG" --title "Road limits $TAG" --notes "ODbL data © OpenStreetMap contributors. https://www.openstreetmap.org/copyright"
          fi
          echo "build release: $TAG"
          # Keep the exit code: an empty matrix must not reach the build job silently.
          MATRIX=$(python3 tools/list_regions.py --done published.txt --offset "$OFFSET" --count "$COUNT") || exit 1
          MATRIX=$(echo "$MATRIX" | python3 -c "import json,sys; d=json.load(sys.stdin); [x.update(tag='$TAG') for x in d['include']]; print(json.dumps(d))")
          COUNT_OUT=$(echo "$MATRIX" | python3 -c "import json,sys; print(len(json.load(sys.stdin)['include']))")
          echo "$COUNT_OUT regions in this run"
          echo "count=$COUNT_OUT" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scratch space on the big disk
        run: |
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          df -h / /mnt
      - name: Install osmium
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Download extract
        run: curl -fL --retry 10 --retry-delay 30 --retry-max-time 1200 --retry-all-errors -o /mnt/work/region.osm.pbf "${{ matrix.url }}"
      - name: Plan the grid (cells of about 2 GB of input each)
        run: |
          SIZE=$(stat -c %s /mnt/work/region.osm.pbf)
          # osmium prints the header bbox as (minlon,minlat,maxlon,maxlat); the builder wants south,west,north,east
          BOX=$(osmium fileinfo -e /mnt/work/region.osm.pbf | grep -oE '\(-?[0-9.]+,-?[0-9.]+,-?[0-9.]+,-?[0-9.]+\)' | head -1 | tr -d '()')
          BOUNDS=$(echo "$BOX" | awk -F, '{print $2","$1","$4","$3}')
          N=$(( (SIZE + 2000000000 - 1) / 2000000000 ))
          SIDE=1; while [ $((SIDE * SIDE)) -lt "$N" ]; do SIDE=$((SIDE + 1)); done
          if [ "$N" -le 1 ]; then GRID=""; else GRID="$SIDE,$SIDE"; fi
          echo "BOUNDS=$BOUNDS" >> "$GITHUB_ENV"
          echo "GRID=$GRID" >> "$GITHUB_ENV"
          echo "pbf $SIZE bytes, bounds $BOUNDS, grid '${GRID:-none}'"
      - name: Keep roads with a maxspeed tag, stream them into the builder
        run: |
          osmium tags-filter /mnt/work/region.osm.pbf w/highway maxspeed maxspeed:forward maxspeed:backward -o /mnt/work/roads.osm.pbf --overwrite
          rm -f /mnt/work/region.osm.pbf
          GRIDARGS=""; if [ -n "$GRID" ]; then GRIDARGS="--bounds $BOUNDS --grid $GRID"; fi
          osmium export /mnt/work/roads.osm.pbf -f geojsonseq -o - | python3 tools/build_roadlimits.py - "/mnt/work/${{ matrix.id }}.sqlite" --region "${{ matrix.id }}" $GRIDARGS
          rm -f /mnt/work/roads.osm.pbf
      - name: Check sizes (GitHub limit is 2 GB per file)
        run: |
          for f in /mnt/work/${{ matrix.id }}.sqlite /mnt/work/${{ matrix.id }}-r*c*.sqlite; do
            [ -f "$f" ] || continue
            ls -l "$f"
            test "$(stat -c %s "$f")" -lt 2000000000 || { echo "$f is over 2 GB"; exit 1; }
          done
      - name: Write manifest entries
        run: |
          for f in /mnt/work/${{ matrix.id }}.sqlite /mnt/work/${{ matrix.id }}-r*c*.sqlite; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .sqlite)
            python3 tools/make_entry.py "$f" --url "https://github.com/${{ github.repository }}/releases/download/${{ matrix.tag }}/$name.sqlite" --out "/mnt/work/entry-$name.json"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=""
          for f in /mnt/work/${{ matrix.id }}.sqlite /mnt/work/${{ matrix.id }}-r*c*.sqlite \
                   /mnt/work/entry-${{ matrix.id }}.json /mnt/work/entry-${{ matrix.id }}-r*c*.json; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          echo "uploading to ${{ matrix.tag }}:$FILES"
          for i in 1 2 3; do
            gh release upload "${{ matrix.tag }}" $FILES --clobber && break
            echo "upload attempt $i failed, retrying"; sleep 20
          done
  manifest:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect entries from every road-limit release and write manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p entries
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^roadlimits-' | while read -r tag; do
            gh release download "$tag" --pattern 'entry-*.json' --dir entries --clobber
          done
          python3 tools/write_manifest.py entries manifest.json
          gh release upload roadlimits-v1 manifest.json --clobber
