name: build-roadlimits
on:
  workflow_dispatch:
    inputs:
      offset:
        description: "First region in the sorted list (0 for the first run)"
        default: "0"
        required: true
      count:
        description: "How many regions to build in this run (max 256)"
        default: "256"
        required: true
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create release once (avoids a race between parallel jobs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view roadlimits-v1 >/dev/null 2>&1 || gh release create roadlimits-v1 --title "Road limits v1" --notes "ODbL data © OpenStreetMap contributors. https://www.openstreetmap.org/copyright"
      - id: plan
        run: echo "matrix=$(python3 tools/list_regions.py --offset ${{ inputs.offset }} --count ${{ inputs.count }})" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scratch space on the big disk
        run: |
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          df -h / /mnt
      - name: Install osmium
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Download extract
        run: curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o /mnt/work/region.osm.pbf "${{ matrix.url }}"
      - name: Keep roads with a maxspeed tag, stream them into the builder
        run: |
          osmium tags-filter /mnt/work/region.osm.pbf w/highway maxspeed maxspeed:forward maxspeed:backward -o /mnt/work/roads.osm.pbf --overwrite
          rm -f /mnt/work/region.osm.pbf
          osmium export /mnt/work/roads.osm.pbf -f geojsonseq -o - | python3 tools/build_roadlimits.py - "/mnt/work/${{ matrix.id }}.sqlite" --region "${{ matrix.id }}"
          rm -f /mnt/work/roads.osm.pbf
      - name: Write manifest entry
        run: python3 tools/make_entry.py "/mnt/work/${{ matrix.id }}.sqlite" --url "https://github.com/${{ github.repository }}/releases/download/roadlimits-v1/${{ matrix.id }}.sqlite" --out "/mnt/work/entry-${{ matrix.id }}.json"
      - name: Check size (GitHub limit is 2 GB per file)
        run: test "$(stat -c %s "/mnt/work/${{ matrix.id }}.sqlite")" -lt 2000000000
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            gh release upload roadlimits-v1 "/mnt/work/${{ matrix.id }}.sqlite" "/mnt/work/entry-${{ matrix.id }}.json" --clobber && break
            echo "upload attempt $i failed, retrying"; sleep 20
          done
  manifest:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect entries and write manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p entries
          gh release download roadlimits-v1 --pattern 'entry-*.json' --dir entries --clobber
          python3 tools/write_manifest.py entries manifest.json
          gh release upload roadlimits-v1 manifest.json --clobber
